# /etc/nginx/sites-available/notes-backend
# Лендинг HomeNote на / (статика), API Ktor на префиксах -> 127.0.0.1:8080.
# Android-приложение ходит на /auth, /notes, /home-cards, /character, /health —
# эти пути по-прежнему уходят на бэкенд, релиз перевыпускать не нужно.

server {
    listen 80;
    listen [::]:80;
    server_name homenoteapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homenoteapp.ru;

    ssl_certificate     /etc/letsencrypt/live/homenoteapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homenoteapp.ru/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Общие настройки проксирования на Ktor-бэкенд ---
    set $backend http://127.0.0.1:8080;

    # --- Статический лендинг (корень сайта) ---
    root /var/www/landing;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # Статические ассеты лендинга (если появятся css/js/img — будут отдаваться напрямую)
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # --- API: эти префиксы уходят на бэкенд ---
    location /auth        { proxy_pass $backend; include /etc/nginx/snippets/notes-proxy.conf; }
    location /notes       { proxy_pass $backend; include /etc/nginx/snippets/notes-proxy.conf; }
    location /home-cards  { proxy_pass $backend; include /etc/nginx/snippets/notes-proxy.conf; }
    location /character   { proxy_pass $backend; include /etc/nginx/snippets/notes-proxy.conf; }
    location /health      { proxy_pass $backend; include /etc/nginx/snippets/notes-proxy.conf; }

    # Остальное (неизвестные пути) — отдаём лендинг/404, на бэкенд не пускаем.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
